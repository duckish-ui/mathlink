# One-click deploy on Render: a single Node service (API + websockets + built React app)
# and a managed PostgreSQL database. See README → Deploying.
services:
  - type: web
    name: mathlink
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mathlink-db
          property: connectionString
      # Paste your Groq key in the Render dashboard to turn on the AI tutor.
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: mathlink-db
    plan: free
    databaseName: mathlink
    user: mathlink
